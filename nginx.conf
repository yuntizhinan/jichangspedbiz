# Nginx 301 Permanent Redirect Configuration Snippet
server {
    listen 80;
    listen 443 ssl;
    server_name jichangspeed.biz www.jichangspeed.biz jichangsped.biz www.jichangsped.biz;

    # 301 Permanent Redirect to new domain preserving URI
    return 301 https://vpnstuijian.com$request_uri;
}
